# OpenShift 4 rejects unauthenticated webhook calls by default. This lets GitHub Actions
# trigger builds in this project; each call still needs the BuildConfig's secret webhook URL.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-access-unauthenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:webhook
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
