# Base image for the Dockerfile's runtime stage (Java 21), and the image the build produces.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: openjdk-21-runtime
  labels:
    app: election-ai
spec:
  lookupPolicy:
    local: false
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi9/openjdk-21-runtime:latest
      importPolicy:
        importMode: Legacy
      referencePolicy:
        type: Source
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: election-ai
  labels:
    app: election-ai
spec:
  lookupPolicy:
    local: false
