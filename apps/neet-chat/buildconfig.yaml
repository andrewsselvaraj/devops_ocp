# Builds the Dockerfile from GitHub and pushes neet-chat:latest.
# Builds run automatically after CI passes on main; manual rebuild: oc start-build neet-chat --follow
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: neet-chat
  labels:
    app: neet-chat
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/andrewsselvaraj/NEET_CHAT.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      from:
        kind: ImageStreamTag
        name: openjdk-17-runtime:latest
  output:
    to:
      kind: ImageStreamTag
      name: neet-chat:latest
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  triggers:
    # Called by GitHub Actions after tests pass on main (see scripts/setup-ci.sh).
    - type: Generic
      generic:
        secretReference:
          name: neet-chat-webhook
    - type: ConfigChange
    - type: ImageChange
      imageChange: {}
