# Source-to-Image build from GitHub with OpenShift's Java 17 builder (no Dockerfile needed).
# Builds run automatically after CI passes on main; manual rebuild: oc start-build php-to-spring-converter --follow
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: php-to-spring-converter
  labels:
    app: php-to-spring-converter
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/andrewsselvaraj/php-to-spring-converter.git
      ref: main
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: java:openjdk-17-ubi8
        namespace: openshift
  output:
    to:
      kind: ImageStreamTag
      name: php-to-spring-converter:latest
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  triggers:
    # Called by GitHub Actions after tests pass on main (see scripts/setup-ci.sh).
    - type: Generic
      generic:
        secretReference:
          name: php-to-spring-converter-webhook
    - type: ConfigChange
    - type: ImageChange
      imageChange: {}
