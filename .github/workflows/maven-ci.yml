# Reusable test workflow for the Spring Boot apps: runs `mvn verify` on every push and pull request.
# Deploys are done by Jenkins (jenkins/Jenkinsfile), not here.
#
# In an app repo, .github/workflows/ci.yml:
#   on: { push: { branches: [main] }, pull_request: {} }
#   jobs:
#     ci:
#       uses: andrewsselvaraj/devops_ocp/.github/workflows/maven-ci.yml@main
name: maven-ci

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "17"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: mvn -B verify

